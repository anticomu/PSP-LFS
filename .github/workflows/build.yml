name: Build PSP Game
on: [push, pull_request]
jobs:
  build:
    runs-on: ubuntu-latest
    container: pspdev/pspdev:latest
    steps:
      - uses: actions/checkout@v4
      - name: Compile
        run: |
          make
      - name: Upload EBOOT
        uses: actions/upload-artifact@v4
        with:
          name: LFS_PSP_EBOOT
          path: EBOOT.PBP
