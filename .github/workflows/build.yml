name: Build PSP ISO
on: [push, pull_request]
jobs:
  build:
    runs-on: ubuntu-latest
    container: pspdev/pspdev:latest
    steps:
      - uses: actions/checkout@v4
      - name: Install ISO Tools
        run: |
          apk add cdrkit
      - name: Compile
        run: |
          make
      - name: Create ISO Structure
        run: |
          mkdir -p iso_root/PSP_GAME/SYSDIR
          cp EBOOT.PBP iso_root/PSP_GAME/SYSDIR/EBOOT.BIN
          cp PARAM.SFO iso_root/PSP_GAME/PARAM.SFO
          echo "UMD_DATA" > iso_root/UMD_DATA.BIN
          # Comando corretto per ISO PSP compatibile
          genisoimage -o LFS_PSP.iso -A "PSP" -V "LFS_PSP" -sysid "PSP" -v -d -N -r -input-charset utf8 iso_root
      - name: Upload ISO
        uses: actions/upload-artifact@v4
        with:
          name: LFS_PSP_ISO
          path: LFS_PSP.iso
